# Times in local wall-clock time — launchd uses your system timezone automatically
schedule:
  - "06:00"   # 6:00 AM — session window opens, resets at 12:00 PM
  - "11:02"   # 11:02 PM — window resets, runs until 5:00 PM
  - "16:04" # 4:04 PM — optional evening block (uncomment to enable)

greeting: "Starting a new work session."

sleep_after_trigger: true
# true  = sleep Mac after trigger if user has been idle 5+ min (woken from sleep)
# false = never sleep (use if Mac is always awake when triggers fire)
