name: Claude Ping

on:
  schedule:
    # Times are UTC. Israel Standard Time = UTC+3, so:
    #   09:00 IST = 06:00 UTC
    #   14:00 IST = 11:00 UTC
    #   19:00 IST = 16:00 UTC
    # Edit these cron entries to change your schedule.
    - cron: '0 6 * * *'    # 06:00 UTC — 09:00 IST
    - cron: '0 11 * * *'   # 11:00 UTC — 14:00 IST
    - cron: '0 16 * * *'   # 16:00 UTC — 19:00 IST
  workflow_dispatch:         # manual trigger for testing

jobs:
  ping:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # needed to commit the session file back
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run Claude Ping
        run: python ping.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit session file
        run: |
          git config user.name "Claude Ping"
          git config user.email "noreply@github.com"
          git add sessions/
          git diff --cached --quiet || git commit -m "session: $(date -u +%Y-%m-%dT%H:%M)"
          git push
